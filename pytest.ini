[pytest]
# ---------------------------------------------------------------------------
# 为什么需要这个文件：
#   tests/ 目录里既带有 __init__.py（包模式），又有测试文件写
#       from conftest import big_refundable_order, ...
#   这种"同目录直接 import"在包模式下会失败 —— pytest 只把项目根目录
#   加进 sys.path，conftest 作为顶层模块就找不到了，报 ImportError。
#
#   pythonpath 把 . 和 tests 都补进去，命令行和 PyCharm 内置的 pytest
#   都能直接跑，不用再手工设 PYTHONPATH。
# ---------------------------------------------------------------------------
pythonpath = . tests
testpaths = tests
